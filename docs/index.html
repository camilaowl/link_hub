<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contact Santehstyl by phone, Telegram, Viber, WhatsApp, or TikTok."
    />
    <meta name="theme-color" content="#f4f1e8" />
    <title>Santehstyl</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="contact-page" class="page-shell">
      <div class="contact-glow contact-glow--top" aria-hidden="true"></div>
      <div class="contact-glow contact-glow--bottom" aria-hidden="true"></div>

      <div class="page-container">
        <a id="home-link" class="logo-link" href="./" aria-label="Santehstyl home">
          <img
            src="./santehstyl-logo.png"
            width="454"
            height="124"
            alt="Santehstyl"
          />
        </a>

        <nav id="contact-links" class="contact-links" aria-label="Contact links">
          <a
            id="phone-link"
            class="contact-link"
            href="tel:+380631326012"
            aria-label="Call Santehstyl at +380 63 132 60 12"
          >
            <span class="contact-icon contact-icon--phone" aria-hidden="true">
              <svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
                />
              </svg>
            </span>
            <span class="contact-copy">
              <span class="contact-value">+380 63 132 60 12</span>
            </span>
            <span class="contact-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>
            </span>
          </a>

          <a
            id="telegram-link"
            class="contact-link"
            href="https://t.me/+380631326012"
            target="_blank"
            rel="noreferrer"
            aria-label="Message Santehstyl on Telegram"
          >
            <span class="contact-icon contact-icon--brand" aria-hidden="true">
              <img src="./Telegram_logo.svg" alt="" />
            </span>
            <span class="contact-copy">
              <span class="contact-value">Telegram</span>
            </span>
            <span class="contact-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>
            </span>
          </a>

          <a
            id="viber-link"
            class="contact-link"
            href="viber://chat?number=%2B380631326012"
            aria-label="Message Santehstyl on Viber"
          >
            <span class="contact-icon contact-icon--brand" aria-hidden="true">
              <img src="./Chat_on_Viber_icon.svg" alt="" />
            </span>
            <span class="contact-copy">
              <span class="contact-value">Viber</span>
            </span>
            <span class="contact-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>
            </span>
          </a>

          <a
            id="whatsapp-link"
            class="contact-link"
            href="https://wa.me/380631326012"
            target="_blank"
            rel="noreferrer"
            aria-label="Message Santehstyl on WhatsApp"
          >
            <span class="contact-icon contact-icon--brand" aria-hidden="true">
              <img src="./whatsapp-com-logo.svg" alt="" />
            </span>
            <span class="contact-copy">
              <span class="contact-value">WhatsApp</span>
            </span>
            <span class="contact-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>
            </span>
          </a>

          <a
            id="tiktok-link"
            class="contact-link"
            href="https://www.tiktok.com/@santehstyl.ua?_r=1&amp;_t=ZS-9BTZwjj0I2K"
            target="_blank"
            rel="noreferrer"
            aria-label="Follow Santehstyl on TikTok"
          >
            <span class="contact-icon contact-icon--brand contact-icon--tiktok" aria-hidden="true">
              <img src="./tiktok-com-logo.png" alt="" />
            </span>
            <span class="contact-copy">
              <span class="contact-value">TikTok</span>
            </span>
            <span class="contact-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                />
              </svg>
            </span>
          </a>
        </nav>
      </div>
    </main>
  </body>
</html>
